[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breachbench"
version = "0.0.3"
description = "Open-source security benchmark, 3-layer Guardrail Shield, and static/dynamic scanner for AI agents, code vulnerabilities, malware lures, phishing, and OWASP API Top 10 flaws."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Tanushree Umathe"}
]
keywords = [
    "security",
    "benchmark",
    "ai-agents",
    "guardrails",
    "owasp",
    "cwe",
    "malware-detection",
    "vulnerability-scanner",
    "prompt-injection",
    "phishing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/tu2090-ops/breachbench"
Repository = "https://github.com/tu2090-ops/breachbench"
Issues = "https://github.com/tu2090-ops/breachbench/issues"
Changelog = "https://github.com/tu2090-ops/breachbench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
breachbench = "breachbench.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["breachbench*", "app*", "labs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
