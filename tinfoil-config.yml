# Tinfoil Container config for BreachBench (CPU-only).
# Reference: https://docs.tinfoil.sh/containers/configuration
# The Tinfoil Release workflow rewrites the image digest on every release.
cvm-version: 0.14.7   # value in https://docs.tinfoil.sh/containers/quickstart
cpus: 2
memory: 8192          # smallest valid value (8 GB)

networks:
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh

containers:
  - name: "breachbench"
    image: "ghcr.io/tu2090-ops/breachbench-localhost:placeholder"
    restart: always
    networks: [inference]
    env:
      - BB_URL: "https://inference.tinfoil.sh/v1"
      - BB_MODEL: "gemma4-31b"
    secrets:
      - TINFOIL_API_KEY
    tmpfs:
      /tmp: size=512m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 2m

shim:
  upstream-port: 8080
  paths:
    - /health
    - /run
    - /results
    - /results.md
